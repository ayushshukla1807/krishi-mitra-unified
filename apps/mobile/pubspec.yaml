name: krishi_mitra_frontend
description: A new Flutter project for Krishi Mitra Farm Buddy.
publish_to: 'none' # Remove this line if you intend to publish to pub.dev
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  provider: ^6.0.5 # For state management
  http: ^1.2.1 # For API calls
  image_picker: ^1.1.0 # For image upload
  geolocator: ^11.0.0 # For location services
  intl: ^0.19.0 # For date/number formatting

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    # Add other assets here (e.g., logo, default crop images)